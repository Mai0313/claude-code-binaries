name: Claude Code Binaries Updater

on:
  push:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions: write-all

jobs:
  auto-update-binaries:
    name: Auto Update Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Claude Code Version
        id: version
        run: |
          VERSION=$(./scripts/install_binaries.sh get_version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Retrieved version: $VERSION"

      - name: Check if Version Exists
        id: check_version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git tag --list | grep -q "^${VERSION}$"; then
            echo "Tag $VERSION already exists"
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag $VERSION does not exist"
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install New Version
        if: ${{ steps.check_version.outputs.tag_exists == 'false' }}
        run: |
          chmod +x ./scripts/install_binaries.sh
          ./scripts/install_binaries.sh

      - name: Download Changelog
        if: ${{ steps.check_version.outputs.tag_exists == 'false' }}
        id: changelog
        run: |
          curl -L https://raw.githubusercontent.com/anthropics/claude-code/refs/heads/main/CHANGELOG.md -o CHANGELOG.md
          {
            echo 'content<<EOF'
            awk '/^## /{if (c++) exit} c' CHANGELOG.md
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Upload Release Assets
        if: ${{ steps.check_version.outputs.tag_exists == 'false' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.content }}
          files: |-
            ./binaries/*/*
            ./build/*
